<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends Network - SKLauncher</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --card-hover: #222226;
      --border: #27272a;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Top User Profile Header */
    .header {
      padding: 18px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 2px solid var(--border);
      image-rendering: pixelated;
      background: #27272a;
    }

    .user-details {
      flex: 1;
    }

    .user-name {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .code-box {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .friend-code-badge {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      background: #27272a;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .btn-copy-code {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-copy-code:hover {
      background: #3f3f46;
      color: var(--text);
    }

    /* Action bar */
    .actions-bar {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #111113;
      border-bottom: 1px solid var(--border);
    }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: var(--primary-hover);
    }

    .search-box {
      flex: 1;
      max-width: 200px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: white;
      font-size: 12px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
    }

    /* Friends List Container */
    .friends-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 8px 0 4px;
    }

    .friend-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .friend-card:hover {
      background: var(--card-hover);
      border-color: #3f3f46;
    }

    .friend-avatar-wrap {
      position: relative;
    }

    .friend-avatar {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      border: 1px solid var(--border);
      image-rendering: pixelated;
      background: #27272a;
    }

    .online-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--success);
      border: 2px solid var(--card-bg);
    }

    .online-indicator.in-game {
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
    }

    .online-indicator.offline {
      background: #71717a;
    }

    .friend-info {
      flex: 1;
      min-width: 0;
    }

    .friend-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .server-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-join {
      background: var(--success-bg);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-join:hover {
      background: var(--success);
      color: black;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #71717a;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-remove:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 360px;
      max-width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .modal-input {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      color: white;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-confirm {
      background: var(--primary);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top User Profile Card -->
  <div class="header">
    <img id="my-avatar" class="user-avatar" src="https://mc-heads.net/avatar/Steve/64" alt="Skin Head" />
    <div class="user-details">
      <div class="user-name">
        <span id="my-username">Loading...</span>
        <div class="user-status-dot"></div>
      </div>
      <div class="code-box">
        <span style="font-size: 11px; color: var(--text-muted);">Friend Code:</span>
        <span id="my-code" class="friend-code-badge">SK-....-....</span>
        <button id="btn-copy" class="btn-copy-code" title="Copy Friend Code">Copy</button>
      </div>
    </div>
  </div>

  <!-- Actions Bar -->
  <div class="actions-bar">
    <button id="btn-open-add" class="btn-add">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Add Friend
    </button>
    <input type="text" id="search-friends" class="search-box" placeholder="Search friends..." />
  </div>

  <!-- Friends List Container -->
  <div id="friends-container" class="friends-container">
    <div class="empty-state">
      <div class="empty-icon">🎮</div>
      <div>Loading friends network...</div>
    </div>
  </div>

  <!-- Add Friend Modal -->
  <div id="modal-add" class="modal-overlay">
    <div class="modal">
      <div class="modal-title">Add a Friend</div>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
        Enter your friend's unique Friend Code (works with both official and offline/cracked accounts).
      </p>
      <input type="text" id="input-friend-code" class="modal-input" placeholder="e.g. SK-A1B2-C3D4" />
      <input type="text" id="input-friend-name" class="modal-input" placeholder="Minecraft Username (for skin)" />
      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn-cancel">Cancel</button>
        <button id="btn-modal-add" class="btn-confirm">Add Friend</button>
      </div>
    </div>
  </div>

  <script>
    const api = window.api;

    let myIdentity = null;
    let allFriends = [];

    async function loadIdentity() {
      try {
        if (api && api.p2pFriends) {
          myIdentity = await api.p2pFriends.getMyIdentity();
        } else {
          // Fallback demo identity
          myIdentity = {
            friendCode: 'SK-7K9A-4M2P',
            username: 'Player',
            avatarUrl: 'https://mc-heads.net/avatar/Steve/64'
          };
        }

        document.getElementById('my-username').textContent = myIdentity.username;
        document.getElementById('my-code').textContent = myIdentity.friendCode;
        document.getElementById('my-avatar').src = myIdentity.avatarUrl;
      } catch (e) {
        console.error('Error loading identity:', e);
      }
    }

    async function loadFriends() {
      try {
        if (api && api.p2pFriends) {
          allFriends = await api.p2pFriends.listFriends();
        } else {
          allFriends = [];
        }
        renderFriends(allFriends);
      } catch (e) {
        console.error('Error loading friends:', e);
      }
    }

    function renderFriends(friends) {
      const container = document.getElementById('friends-container');
      const query = document.getElementById('search-friends').value.toLowerCase().trim();

      const filtered = friends.filter(f => 
        f.username.toLowerCase().includes(query) || f.friendCode.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">👥</div>
            <div style="font-weight: 600; color: #d4d4d8;">No friends added yet</div>
            <div style="font-size: 12px; margin-top: 6px;">
              Share your Friend Code <b>${myIdentity ? myIdentity.friendCode : ''}</b> or click "Add Friend" to connect!
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      // Separate into In-Game, Online, Offline
      const inGame = filtered.filter(f => f.status === 'in-game' || f.currentServer);
      const online = filtered.filter(f => f.status === 'online' && !f.currentServer);
      const offline = filtered.filter(f => f.status === 'offline');

      if (inGame.length > 0) {
        appendSection(container, 'Playing Minecraft (' + inGame.length + ')', inGame);
      }
      if (online.length > 0) {
        appendSection(container, 'Online (' + online.length + ')', online);
      }
      if (offline.length > 0) {
        appendSection(container, 'Offline (' + offline.length + ')', offline);
      }
    }

    function appendSection(container, title, list) {
      const secTitle = document.createElement('div');
      secTitle.className = 'section-title';
      secTitle.textContent = title;
      container.appendChild(secTitle);

      for (const friend of list) {
        const card = document.createElement('div');
        card.className = 'friend-card';

        const isPlaying = friend.status === 'in-game' || !!friend.currentServer;
        const isOnline = friend.status === 'online';
        const statusClass = isPlaying ? 'in-game' : (isOnline ? 'online' : 'offline');

        let statusText = 'Offline';
        if (isPlaying) {
          statusText = friend.currentServer ? `Playing on <span class="server-badge">${friend.currentServer}</span>` : 'In Singleplayer';
        } else if (isOnline) {
          statusText = 'In Launcher (Idle)';
        }

        const joinBtnHtml = (isPlaying && friend.currentServer)
          ? `<button class="btn-join" onclick="joinServer('${friend.currentServer}')">Join Server</button>`
          : '';

        card.innerHTML = `
          <div class="friend-avatar-wrap">
            <img class="friend-avatar" src="${friend.avatarUrl}" alt="${friend.username}" onerror="this.src='https://mc-heads.net/avatar/Steve/64'" />
            <div class="online-indicator ${statusClass}"></div>
          </div>
          <div class="friend-info">
            <div class="friend-name">${friend.username}</div>
            <div class="friend-sub">${statusText}</div>
          </div>
          ${joinBtnHtml}
          <button class="btn-remove" title="Remove Friend" onclick="removeFriend('${friend.friendCode}')">✕</button>
        `;

        container.appendChild(card);
      }
    }

    window.joinServer = async function(serverAddress) {
      if (api && api.p2pFriends) {
        const res = await api.p2pFriends.joinServer(serverAddress);
        alert(res.message);
      } else {
        alert('Copied server IP: ' + serverAddress);
      }
    };

    window.removeFriend = async function(friendCode) {
      if (confirm('Are you sure you want to remove this friend?')) {
        if (api && api.p2pFriends) {
          await api.p2pFriends.removeFriend(friendCode);
        }
        allFriends = allFriends.filter(f => f.friendCode !== friendCode);
        renderFriends(allFriends);
      }
    };

    // Copy my code
    document.getElementById('btn-copy').addEventListener('click', () => {
      if (!myIdentity) return;
      navigator.clipboard.writeText(myIdentity.friendCode);
      const btn = document.getElementById('btn-copy');
      btn.textContent = 'Copied!';
      btn.style.color = '#4ade80';
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.style.color = '';
      }, 1500);
    });

    // Add friend modal
    const modal = document.getElementById('modal-add');
    document.getElementById('btn-open-add').addEventListener('click', () => {
      document.getElementById('input-friend-code').value = '';
      document.getElementById('input-friend-name').value = '';
      modal.classList.add('open');
      document.getElementById('input-friend-code').focus();
    });

    document.getElementById('btn-modal-cancel').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    document.getElementById('btn-modal-add').addEventListener('click', async () => {
      const code = document.getElementById('input-friend-code').value.trim();
      const name = document.getElementById('input-friend-name').value.trim();

      if (!code) {
        alert('Please enter a Friend Code.');
        return;
      }

      if (api && api.p2pFriends) {
        const res = await api.p2pFriends.addFriend(code, name);
        if (!res.success) {
          alert('Error: ' + res.error);
          return;
        }
        allFriends.push(res.friend);
      } else {
        allFriends.push({
          friendCode: code.toUpperCase(),
          username: name || 'Friend_' + code.slice(-4),
          avatarUrl: 'https://mc-heads.net/avatar/' + encodeURIComponent(name || 'Steve') + '/64',
          status: 'online',
          currentServer: null
        });
      }

      modal.classList.remove('open');
      renderFriends(allFriends);
    });

    // Search filter
    document.getElementById('search-friends').addEventListener('input', () => {
      renderFriends(allFriends);
    });

    // Initial load
    loadIdentity().then(() => loadFriends());
  </script>
</body>
</html>
